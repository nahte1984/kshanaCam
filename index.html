<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<title>kshanaCam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway+Dots&display=block" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #view{position:fixed;left:0;top:0;display:block;touch-action:none}
  #splash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#000;cursor:pointer;transition:opacity .5s}
  #splash.wait{pointer-events:none}
  #splash.wait #go{opacity:.5}
  #splash.out{opacity:0}
  #go{position:relative;font-family:'Raleway Dots',sans-serif;font-weight:400;font-size:min(62px,16.5vw);line-height:normal;color:#fff;background:none;border:0;padding:0;margin:0;white-space:nowrap;cursor:pointer;transition:opacity .2s}
  /* 點點底線：用字型本身的單位畫（1em = 1000），點直徑 20、間距 37，跟 Raleway Dots 的底線字元一樣 */
  #go .ul{position:absolute;left:0;top:1.05em;width:100%;height:.02em;overflow:visible;pointer-events:none}
  #splash:active #go{opacity:.5}
  #cam{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="view"></canvas>
<video id="cam" playsinline muted autoplay></video>
<div id="splash">
  <button id="go" aria-label="開始 kshanaCam（需要相機與動作感測權限）">kshanaCam<svg class="ul" viewBox="0 0 5309 20" preserveAspectRatio="none" aria-hidden="true"></svg></button>
</div>

<script>
// ───────── 參數 ─────────
const CELL    = 5;      // 每格 5×5 CSS px，一顆沙佔一格
const KSHANA  = 1000 / 75; // 一剎那（毫秒）：一秒 75 剎那，每一剎那從畫面最上方落下一顆沙
const BACKLOG = 75;     // 上方被堵住時，最多先記著幾顆還沒落下的沙（一秒份）
const TICK    = 40;     // 每顆沙每隔幾毫秒重新取樣一次相機顏色（一秒 25 次）

// 沙子流動
const ACC     = 320;    // 重力加速度（格/s²）
const VMAX    = 180;    // 最快速度（格/s）
const STILL   = 0.1;    // 傾斜小於這個程度（約 6°）沙子不動
const FULL    = 0.55;   // 傾斜到這個程度（約 33°）重力全開
const SLIDE   = 0.6;    // 碰到東西往旁邊滑時保留的速度
const REPOSE  = 0.02;   // 往下坡滾的最小坡度（越大沙堆越陡、越不容易崩）

const EASE    = 0.12;   // 重力方向跟隨速度（越小越有慣性）
const SAMPLE  = 160;    // 相機取樣解析度（長邊）
const SCATTER = 0.07;   // 亂數取樣的範圍（相機畫面長邊的比例）；越小臉越清楚

// 手指撥開
const PUSH    = 0.13;   // 手指撥開半徑（螢幕短邊的比例）
const GROW    = 0.3;    // 按下時撥開半徑展開的速度

const WHITE = 0xffffffff, BLACK = 0xff000000;
// 被擋住時可以去的格子：周圍兩格內，往下坡的方向。
// 隔一格的要能「從上面滾過去」（中間那格是空的），沙堆才會像真的沙一樣崩塌、攤開。
const HOPS = [];
for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
  if (!dx && !dy) continue;
  const len = Math.hypot(dx, dy);
  HOPS.push({ dx, dy, ux: dx / len, uy: dy / len, far: Math.abs(dx) === 2 || Math.abs(dy) === 2 });
}
let hopA = [], hopB = [];   // 這一幀依坡度排好的候選（兩種平手時的順序，左右各半）

const view  = document.getElementById('view'),  vctx = view.getContext('2d');
const grid  = document.createElement('canvas'), gctx = grid.getContext('2d');
const samp  = document.createElement('canvas'), sctx = samp.getContext('2d', { willReadFrequently: true });
const video = document.getElementById('cam');
const splash = document.getElementById('splash'), go = document.getElementById('go');

let W, H, cols, rows, N, dpr, pushR, img, buf, occ;   // occ：每格是哪顆沙（-1 = 空）
// 沙粒資料（容量 = 格子數，畫面最多被沙填滿）
let GX, GY;          // 沙粒所在的格子
let OX, OY;          // 格子內的小數位移（格）
let VX, VY;          // 速度（格/s）
let COL;             // 目前的顏色
let KEY, ORDER;      // 由低到高處理
let count = 0;       // 目前畫面上有幾顆沙（一開始是 0）
let SW = 0, SH = 0, camReady = false, mirror = true, lastSrc = null;
let started = false;

// ───────── 版面：切成 5px 格子 ─────────
function layout() {
  W = innerWidth; H = innerHeight;
  dpr = Math.min(devicePixelRatio || 1, 3);
  cols = Math.ceil(W / CELL); rows = Math.ceil(H / CELL); N = cols * rows;
  pushR = Math.max(36, Math.min(90, Math.min(W, H) * PUSH));

  grid.width = cols; grid.height = rows;
  view.width  = Math.round(cols * CELL * dpr);
  view.height = Math.round(rows * CELL * dpr);
  view.style.width  = cols * CELL + 'px';
  view.style.height = rows * CELL + 'px';
  vctx.imageSmoothingEnabled = false;

  img = gctx.createImageData(cols, rows);
  buf = new Uint32Array(img.data.buffer);
  occ = new Int32Array(N).fill(-1);

  // 換尺寸（例如轉橫）時，把已經落下的沙搬進新的格子
  const old = count ? { gx: GX.slice(0, count), gy: GY.slice(0, count), col: COL.slice(0, count) } : null;
  GX = new Int32Array(N); GY = new Int32Array(N);
  OX = new Float32Array(N); OY = new Float32Array(N);
  VX = new Float32Array(N); VY = new Float32Array(N);
  COL = new Uint32Array(N).fill(WHITE);
  KEY = new Float32Array(N); ORDER = new Int32Array(N);
  const n = old ? Math.min(old.gx.length, N) : 0;
  count = 0;
  for (let k = 0; k < n; k++) {
    if (!place(count, Math.min(cols - 1, old.gx[k]), Math.min(rows - 1, old.gy[k]))) break;
    COL[count] = old.col[k]; ORDER[count] = count; count++;
  }
}

// 新的一剎那：從畫面最上方一排的隨機位置落下一顆沙
function spawn() {
  if (count >= N) return false;
  const start = (Math.random() * cols) | 0;
  for (let k = 0; k < cols; k++) {
    const x = (start + k) % cols;
    if (occ[x] !== -1) continue;
    const i = count++;
    occ[x] = i; GX[i] = x; GY[i] = 0;
    OX[i] = OY[i] = VX[i] = VY[i] = 0;
    ORDER[i] = i;
    COL[i] = lastSrc ? sampleOne(x, 0, lastSrc) : WHITE;   // 亮起的這一刻就取樣一次
    return true;
  }
  return false;   // 最上面一排都被堵住了
}

// 把沙粒放進 (x, y)；有人了就往外找最近的空格
function place(i, x, y) {
  for (let r = 0; r < Math.max(cols, rows); r++) {
    for (let k = 0; k < 8 * Math.max(1, r); k++) {
      const a = (k / (8 * Math.max(1, r))) * 6.2832;
      const nx = Math.round(x + Math.cos(a) * r), ny = Math.round(y + Math.sin(a) * r);
      if (nx < 0 || ny < 0 || nx >= cols || ny >= rows || occ[ny * cols + nx] !== -1) continue;
      occ[ny * cols + nx] = i; GX[i] = nx; GY[i] = ny; OX[i] = OY[i] = VX[i] = VY[i] = 0;
      return true;
    }
  }
  return false;
}

// ───────── 重力方向 ─────────
let gx = 0, gy = 0.6;       // 平滑後的重力（螢幕座標，長度 0~1 = 傾斜程度）
let tx = gx, ty = gy;       // 目標值
let dirx = 0, diry = 1;
let sensor = false, lastMouse = -1e9;

function screenAngle() {
  if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
  return typeof window.orientation === 'number' ? window.orientation : 0;
}

addEventListener('deviceorientation', e => {
  if (e.beta == null || e.gamma == null) return;
  sensor = true;
  const b = e.beta * Math.PI / 180, g = e.gamma * Math.PI / 180;
  // 重力投影到螢幕平面（直立手機座標，y 向下）
  const px = Math.sin(g) * Math.cos(b), py = Math.sin(b);
  // 依螢幕旋轉角度轉回目前畫面方向
  const a = -screenAngle() * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
  tx = px * c - py * s;
  ty = px * s + py * c;
});

// ───────── 手指：按住撥開沙子 ─────────
const touches = new Map();   // pointerId → { x, y, lx, ly, r }

addEventListener('pointerdown', e => {
  if (!started) return;
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, r: 0 });
});

addEventListener('pointermove', e => {
  const t = touches.get(e.pointerId);
  if (t) { t.x = e.clientX; t.y = e.clientY; return; }
  // 桌機沒有陀螺儀：滑鼠（沒按下時）的位置當作傾斜方向
  if (!sensor && e.pointerType === 'mouse') {
    lastMouse = performance.now();
    let x = (e.clientX - W / 2) / (W / 2), y = (e.clientY - H / 2) / (H / 2);
    const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; }
    tx = x; ty = y;
  }
});

const release = e => touches.delete(e.pointerId);
addEventListener('pointerup', release);
addEventListener('pointercancel', release);
addEventListener('contextmenu', e => e.preventDefault());

// 把手指圓圈裡的沙子沿半徑方向推到圈外最近的空格，堆在圓圈邊緣
function push(fx, fy, r) {
  const cx = fx / CELL - 0.5, cy = fy / CELL - 0.5, rc = r / CELL;
  const x0 = Math.max(0, Math.floor(cx - rc)), x1 = Math.min(cols - 1, Math.ceil(cx + rc));
  const y0 = Math.max(0, Math.floor(cy - rc)), y1 = Math.min(rows - 1, Math.ceil(cy + rc));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const i = occ[y * cols + x];
    if (i === -1) continue;
    let dx = x - cx, dy = y - cy;
    const d = Math.hypot(dx, dy);
    if (d >= rc) continue;
    if (d < 1e-3) { const a = Math.random() * 6.2832; dx = Math.cos(a); dy = Math.sin(a); } else { dx /= d; dy /= d; }
    occ[y * cols + x] = -1;
    let done = false;
    for (let s = rc; s < rc + 60 && !done; s += 0.5) {             // 沿半徑往外找第一個空格
      const nx = Math.round(cx + dx * s), ny = Math.round(cy + dy * s);
      if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) break;
      if (occ[ny * cols + nx] === -1) { occ[ny * cols + nx] = i; GX[i] = nx; GY[i] = ny; done = true; }
    }
    if (!done) place(i, Math.round(cx + dx * (rc + 1)), Math.round(cy + dy * (rc + 1)));
    OX[i] = OY[i] = VX[i] = VY[i] = 0;
  }
}

// ───────── 沙子一步 ─────────
function tryMove(i, sx, sy) {
  const nx = GX[i] + sx, ny = GY[i] + sy;
  if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) return false;
  const n = ny * cols + nx;
  if (occ[n] !== -1) return false;
  occ[GY[i] * cols + GX[i]] = -1; occ[n] = i; GX[i] = nx; GY[i] = ny;
  return true;
}

function isFree(x, y) { return x >= 0 && y >= 0 && x < cols && y < rows && occ[y * cols + x] === -1; }

function slide(i) {
  const list = Math.random() < 0.5 ? hopA : hopB;
  const x = GX[i], y = GY[i];
  for (const h of list) {
    if (!isFree(x + h.dx, y + h.dy)) continue;
    if (h.far) {
      // 中間那格：取比較「上面」（逆著重力）的那一格，要是空的才滾得過去
      const hx = h.dx / 2, hy = h.dy / 2;
      let mx = Math.round(hx), my = Math.round(hy);
      if (hx !== mx || hy !== my) {
        const ax = Math.floor(hx), ay = Math.floor(hy), bx = Math.ceil(hx), by = Math.ceil(hy);
        if (ax * dirx + ay * diry <= bx * dirx + by * diry) { mx = ax; my = ay; } else { mx = bx; my = by; }
      }
      if (!isFree(x + mx, y + my)) continue;
    }
    return tryMove(i, h.dx, h.dy);
  }
  return false;
}

function stepSand(dt, a) {
  const ax = dirx * a, ay = diry * a;

  // 依坡度排候選方向（只留往下坡的）；平手時一份偏左、一份偏右
  const cand = HOPS.map(h => ({ h, s: h.ux * dirx + h.uy * diry, side: h.ux * -diry + h.uy * dirx }))
                   .filter(c => c.s > REPOSE);
  hopA = cand.slice().sort((p, q) => (q.s - p.s) || (q.side - p.side)).map(c => c.h);
  hopB = cand.slice().sort((p, q) => (q.s - p.s) || (p.side - q.side)).map(c => c.h);
  // 由最低處的沙先動，上面的沙才有空間落下
  for (let i = 0; i < count; i++) KEY[i] = (GX[i] + OX[i]) * dirx + (GY[i] + OY[i]) * diry;
  for (let k = 1; k < count; k++) {
    const o = ORDER[k], v = KEY[o];
    let j = k - 1;
    while (j >= 0 && KEY[ORDER[j]] < v) { ORDER[j + 1] = ORDER[j]; j--; }
    ORDER[j + 1] = o;
  }

  const damp = a === 0 ? Math.exp(-12 * dt) : 1;
  for (let k = 0; k < count; k++) {
    const i = ORDER[k];
    VX[i] = (VX[i] + ax * dt) * damp; VY[i] = (VY[i] + ay * dt) * damp;
    const sp = Math.hypot(VX[i], VY[i]);
    if (sp > VMAX) { VX[i] *= VMAX / sp; VY[i] *= VMAX / sp; }
    OX[i] += VX[i] * dt; OY[i] += VY[i] * dt;

    for (let guard = 0; guard < 6 && (OX[i] >= 0.5 || OX[i] <= -0.5 || OY[i] >= 0.5 || OY[i] <= -0.5); guard++) {
      const sx = OX[i] >= 0.5 ? 1 : OX[i] <= -0.5 ? -1 : 0;
      const sy = OY[i] >= 0.5 ? 1 : OY[i] <= -0.5 ? -1 : 0;
      if (tryMove(i, sx, sy)) { OX[i] -= sx; OY[i] -= sy; continue; }

      // 被擋住：往下坡最陡、而且有空位的方向滑或滾過去
      if (slide(i)) { OX[i] = OY[i] = 0; VX[i] *= SLIDE; VY[i] *= SLIDE; break; }
      // 完全被擋住：停下來，緊靠著旁邊的沙
      OX[i] = OY[i] = 0; VX[i] = VY[i] = 0;
      break;
    }
  }
}

// ───────── 主迴圈 ─────────
let last = performance.now(), tickAcc = TICK, spawnAcc = 0, pending = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const ms = Math.min(50, now - last); last = now;
  const dt = ms / 1000, f = ms / 16.667;

  // 沒有陀螺儀也沒動滑鼠時：重力緩慢繞圈，讓畫面保持活著
  if (!sensor && now - lastMouse > 3000) {
    const t = now * 0.00022;
    tx = 0.7 * Math.cos(t + 1.0); ty = 0.7 * Math.sin(t + 1.0);
  }

  const e = 1 - Math.pow(1 - EASE, f);
  gx += (tx - gx) * e; gy += (ty - gy) * e;
  let m = Math.hypot(gx, gy);
  if (m > 1e-4) { dirx = gx / m; diry = gy / m; }
  if (m > 1) m = 1;
  const a = m < STILL ? 0 : ACC * Math.min(1, (m - STILL) / (FULL - STILL));

  // 每一剎那落下一顆沙（一秒 75 顆）
  spawnAcc += ms;
  while (spawnAcc >= KSHANA) { spawnAcc -= KSHANA; pending = Math.min(BACKLOG, pending + 1); }
  while (pending > 0 && spawn()) pending--;
  if (count >= N) pending = 0;   // 畫面滿了

  stepSand(dt, a);

  // 手指把沙子推開（移動太快時分段推，避免穿過）
  const g = 1 - Math.pow(1 - GROW, f);
  for (const t of touches.values()) {
    t.r += (pushR - t.r) * g;
    const steps = Math.max(1, Math.min(10, Math.ceil(Math.hypot(t.x - t.lx, t.y - t.ly) / (t.r * 0.4 + 1))));
    for (let s = 1; s <= steps; s++) {
      const q = s / steps;
      push(t.lx + (t.x - t.lx) * q, t.ly + (t.y - t.ly) * q, t.r);
    }
    t.lx = t.x; t.ly = t.y;
  }

  // 每 TICK 毫秒，每顆沙重新取樣一次相機顏色（就算位置沒動也一樣）
  tickAcc += ms;
  if (tickAcc >= TICK) { tickAcc %= TICK; sampleColors(); }

  buf.fill(BLACK);
  for (let i = 0; i < count; i++) buf[GY[i] * cols + GX[i]] = COL[i];
  gctx.putImageData(img, 0, 0);
  vctx.drawImage(grid, 0, 0, view.width, view.height);
}

function sampleColors() {
  if (!camReady || video.readyState < 2) return;
  sctx.drawImage(video, 0, 0, SW, SH);
  lastSrc = new Uint32Array(sctx.getImageData(0, 0, SW, SH).data.buffer);
  for (let i = 0; i < count; i++) COL[i] = sampleOne(GX[i], GY[i], lastSrc);
}

// 在格子 (x, y) 對應的相機位置附近亂數取樣（三角分布：越靠近中心機率越高）
function sampleOne(x, y, src) {
  const s = Math.max(W / SW, H / SH), spread = SCATTER * Math.max(SW, SH);
  const px = (x + 0.5) * CELL - W / 2, py = (y + 0.5) * CELL - H / 2;
  let sx = px / s + SW / 2, sy = py / s + SH / 2;
  if (mirror) sx = SW - sx;
  sx += (Math.random() + Math.random() - 1) * spread;
  sy += (Math.random() + Math.random() - 1) * spread;
  sx = sx < 0 ? 0 : sx >= SW ? SW - 1 : sx;
  sy = sy < 0 ? 0 : sy >= SH ? SH - 1 : sy;
  return src[(sy | 0) * SW + (sx | 0)] | BLACK;
}

// ───────── 相機 ─────────
function setupSample() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return;
  const s = SAMPLE / Math.max(vw, vh);
  SW = Math.max(1, Math.round(vw * s)); SH = Math.max(1, Math.round(vh * s));
  samp.width = SW; samp.height = SH;
  camReady = true;
}
video.addEventListener('loadedmetadata', setupSample);
video.addEventListener('resize', setupSample);

// ───────── 開始（權限必須在點擊當下請求） ─────────
let starting = false;
splash.addEventListener('click', async e => {
  e.stopPropagation();
  if (starting || started) return;
  starting = true;
  splash.classList.add('wait');
  const DOE = window.DeviceOrientationEvent;
  const motionP = (DOE && typeof DOE.requestPermission === 'function')
    ? DOE.requestPermission().catch(() => 'denied') : Promise.resolve('granted');
  const camP = (navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
    ? navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false
      }).catch(() => null)
    : Promise.resolve(null);

  // 等權限都回覆了，才關掉 splash、開始粒子
  const [, stream] = await Promise.all([motionP, camP]);
  if (stream) {
    const st = stream.getVideoTracks()[0]?.getSettings?.() || {};
    mirror = st.facingMode ? st.facingMode === 'user' : true;   // 自拍鏡頭像鏡子一樣左右相反
    video.srcObject = stream;
    video.play().catch(() => {});
  }

  started = true;
  last = performance.now();
  requestAnimationFrame(frame);
  splash.classList.add('out');
  setTimeout(() => splash.remove(), 600);
  keepAwake();
});

// 螢幕常亮
let lock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator) lock = await navigator.wakeLock.request('screen'); } catch (_) {}
}
document.addEventListener('visibilitychange', () => { if (started && document.visibilityState === 'visible') keepAwake(); });

let rt;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { touches.clear(); layout(); }, 120); });

// splash 標題的點點底線：「kshanaCam」字寬 5309 單位，排 143 個點、置中
(() => {
  const svg = go.querySelector('.ul'), NS = 'http://www.w3.org/2000/svg';
  const WIDTH = 5309, D = 20, GAP = 37;
  const n = Math.floor((WIDTH - D) / GAP) + 1;
  const x0 = (WIDTH - ((n - 1) * GAP + D)) / 2 + D / 2;
  for (let i = 0; i < n; i++) {
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', x0 + i * GAP); c.setAttribute('cy', D / 2); c.setAttribute('r', D / 2); c.setAttribute('fill', '#fff');
    svg.appendChild(c);
  }
})();
