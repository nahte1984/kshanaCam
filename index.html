<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<title>kshanaCam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway+Dots&display=block" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #view{position:fixed;left:0;top:0;display:block;touch-action:none}
  #splash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#313131;cursor:pointer;transition:opacity .5s}
  #splash.wait{pointer-events:none}
  #splash.wait #go{opacity:.5}
  #splash.out{opacity:0}
  #go{position:relative;font-family:'Raleway Dots',sans-serif;font-weight:400;font-size:min(62px,16.5vw);line-height:normal;color:#fff;background:none;border:0;padding:0;margin:0;white-space:nowrap;cursor:pointer;transition:opacity .2s}
  /* 點點底線：用字型本身的單位畫（1em = 1000），點直徑 20、間距 37，跟 Raleway Dots 的底線字元一樣 */
  #go .ul{position:absolute;left:0;top:1.05em;width:100%;height:.02em;overflow:visible;pointer-events:none}
  #splash:active #go{opacity:.5}
  #cam{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="view"></canvas>
<video id="cam" playsinline muted autoplay></video>
<div id="splash">
  <button id="go" aria-label="開始 kshanaCam（需要相機與動作感測權限）">kshanaCam<svg class="ul" viewBox="0 0 5309 20" preserveAspectRatio="none" aria-hidden="true"></svg></button>
</div>

<script>
// ───────── 參數 ─────────
const CELL    = 5;      // 每格 5×5 CSS px
const COUNT   = 1000;   // 粒子數
const TICK    = 40;     // 畫面每隔幾毫秒換一張（跟原本的 GIF 一樣，一秒 25 張）
const JITTER  = 1.4;    // 每一張粒子在原位附近跳動的範圍（格）——閃爍的程度

// 沙子的分布：低處是一堆沙，上方飄著稀疏的細沙
const PILE    = 0.45;   // 沙堆裡每格的粒子密度
const DUST    = 0.012;  // 上方稀疏處每格的粒子密度
const SURF    = 0.05;   // 沙堆表面的柔軟度（越大越漸層）

// 沙子流動
const GRAV    = 2200;   // 重力加速度（px/s²）
const SOFT    = 24;     // 接近落點時開始減速的距離（px）
const DRAG    = 1.2;    // 空中的阻力
const SETTLE  = 10;     // 落定時的阻力（越大越不會彈）
const LATERAL = 0.35;   // 橫向滑動的力（相對重力）
const FULL    = 0.55;   // 傾斜到這個程度（約 33°）沙堆就完全成形
const GRAIN   = 6;      // 沙粒直徑（px）：沙子之間至少隔這麼遠，流動時才不會擠成一條線

const EASE    = 0.12;   // 重力方向跟隨速度（越小越有慣性）
const SAMPLE  = 160;    // 相機取樣解析度（長邊）
const SCATTER = 0.07;   // 亂數取樣的範圍（相機畫面長邊的比例）；越小臉越清楚

// 手指撥開
const PUSH    = 0.13;   // 手指撥開半徑（螢幕短邊的比例）
const GROW    = 0.3;    // 按下時撥開半徑展開的速度

const WHITE = 0xffffffff, BLACK = 0xff000000;

const view  = document.getElementById('view'),  vctx = view.getContext('2d');
const grid  = document.createElement('canvas'), gctx = grid.getContext('2d');
const samp  = document.createElement('canvas'), sctx = samp.getContext('2d', { willReadFrequently: true });
const video = document.getElementById('cam');
const splash = document.getElementById('splash'), go = document.getElementById('go');

let W, H, cols, rows, N, dpr, pushR, img, buf;
let U, V;                                   // 每格中心（以螢幕中心為原點）
const PX = new Float32Array(COUNT), PY = new Float32Array(COUNT);   // 粒子位置
const VX = new Float32Array(COUNT), VY = new Float32Array(COUNT);   // 粒子速度
const QU = new Float32Array(COUNT), QV = new Float32Array(COUNT);   // 粒子在沙堆裡的「順位」（深淺、左右）
const KA = new Float32Array(COUNT), KL = new Float32Array(COUNT);   // 排序用：沿重力、橫向的座標
const OA = new Int32Array(COUNT), OL = new Int32Array(COUNT);       // 依座標排好的粒子順序
for (let i = 0; i < COUNT; i++) { OA[i] = i; OL[i] = i; }
const BAND = 25;                                                    // 每一層幾顆沙子一起排左右
const BINS = 256, hist = new Float32Array(BINS), cum = new Float64Array(BINS + 1);
let SW = 0, SH = 0, camReady = false, mirror = true;
let started = false, seeded = false;

// ───────── 版面：切成 5px 格子 ─────────
function layout() {
  W = innerWidth; H = innerHeight;
  dpr = Math.min(devicePixelRatio || 1, 3);
  cols = Math.ceil(W / CELL); rows = Math.ceil(H / CELL); N = cols * rows;
  pushR = Math.max(36, Math.min(90, Math.min(W, H) * PUSH));

  grid.width = cols; grid.height = rows;
  view.width  = Math.round(cols * CELL * dpr);
  view.height = Math.round(rows * CELL * dpr);
  view.style.width  = cols * CELL + 'px';
  view.style.height = rows * CELL + 'px';
  vctx.imageSmoothingEnabled = false;

  img = gctx.createImageData(cols, rows);
  buf = new Uint32Array(img.data.buffer);
  U = new Float32Array(N); V = new Float32Array(N);
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const i = y * cols + x;
    U[i] = (x + 0.5) * CELL - W / 2;
    V[i] = (y + 0.5) * CELL - H / 2;
  }

  if (!seeded) {                                    // 一開始粒子均勻散在整個畫面
    seeded = true;
    for (let i = 0; i < COUNT; i++) {
      PX[i] = (Math.random() - 0.5) * W; PY[i] = (Math.random() - 0.5) * H;
    }
  } else {
    for (let i = 0; i < COUNT; i++) {
      PX[i] = Math.max(-W / 2, Math.min(W / 2, PX[i]));
      PY[i] = Math.max(-H / 2, Math.min(H / 2, PY[i]));
    }
  }
}

// ───────── 重力方向 ─────────
let gx = 0.35, gy = 0.55;   // 平滑後的重力（螢幕座標，長度 0~1 = 傾斜程度）
let tx = gx,  ty = gy;      // 目標值
let dirx = 0.54, diry = 0.84;
let sensor = false, lastMouse = -1e9;

function screenAngle() {
  if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
  return typeof window.orientation === 'number' ? window.orientation : 0;
}

addEventListener('deviceorientation', e => {
  if (e.beta == null || e.gamma == null) return;
  sensor = true;
  const b = e.beta * Math.PI / 180, g = e.gamma * Math.PI / 180;
  // 重力投影到螢幕平面（直立手機座標，y 向下）
  const px = Math.sin(g) * Math.cos(b), py = Math.sin(b);
  // 依螢幕旋轉角度轉回目前畫面方向
  const a = -screenAngle() * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
  tx = px * c - py * s;
  ty = px * s + py * c;
});

// ───────── 手指：按住撥開沙子 ─────────
const touches = new Map();   // pointerId → { x, y, lx, ly, r }

addEventListener('pointerdown', e => {
  if (!started) return;
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, r: 0 });
});

addEventListener('pointermove', e => {
  const t = touches.get(e.pointerId);
  if (t) { t.x = e.clientX; t.y = e.clientY; return; }
  // 桌機沒有陀螺儀：滑鼠（沒按下時）的位置當作傾斜方向
  if (!sensor && e.pointerType === 'mouse') {
    lastMouse = performance.now();
    let x = (e.clientX - W / 2) / (W / 2), y = (e.clientY - H / 2) / (H / 2);
    const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; }
    tx = x; ty = y;
  }
});

const release = e => touches.delete(e.pointerId);
addEventListener('pointerup', release);
addEventListener('pointercancel', release);
addEventListener('contextmenu', e => e.preventDefault());

// 把手指圓圈裡的沙子推到圓圈外，並去掉往內的速度
function push(fx, fy, r) {
  fx -= W / 2; fy -= H / 2;
  const r2 = r * r;
  for (let i = 0; i < COUNT; i++) {
    const dx = PX[i] - fx, dy = PY[i] - fy;
    if (dx > r || dx < -r || dy > r || dy < -r) continue;
    const d2 = dx * dx + dy * dy;
    if (d2 >= r2) continue;
    let ux, uy;
    if (d2 > 1e-6) { const d = Math.sqrt(d2); ux = dx / d; uy = dy / d; }
    else { const a = Math.random() * 6.2832; ux = Math.cos(a); uy = Math.sin(a); }
    const rr = r * (1 + 0.15 * Math.random());
    PX[i] = fx + ux * rr; PY[i] = fy + uy * rr;
    const vn = VX[i] * ux + VY[i] * uy;
    if (vn < 0) { VX[i] -= vn * ux; VY[i] -= vn * uy; }
  }
}

// ───────── 沙子的目標分布 ─────────
// 沿重力方向的位置 t：0 = 最高的角落，1 = 最低的角落。
// 每格密度 ρ(t) = 稀疏 + (沙堆 − 稀疏) × S 形曲線，沙堆表面的位置由粒子總數決定。
// 傾斜越小，沙堆越鬆、表面越柔，平放時整個畫面均勻。
function solveLevels(m) {
  const ext = Math.abs(W / 2 * dirx) + Math.abs(H / 2 * diry);
  const ax = dirx / (2 * ext), ay = diry / (2 * ext);
  hist.fill(0);
  for (let i = 0; i < N; i++) {                     // 每個 t 有多少格（等高線的長度）
    let t = 0.5 + U[i] * ax + V[i] * ay;
    let b = (t * BINS) | 0; b = b < 0 ? 0 : b >= BINS ? BINS - 1 : b;
    hist[b]++;
  }
  const mean = COUNT / N, k = Math.pow(Math.min(1, m / FULL), 0.8);
  const hi = mean + (PILE - mean) * k, lo = mean - (mean - DUST) * k;
  const w = SURF + 0.35 * (1 - k);
  const rho = (t, s) => lo + (hi - lo) / (1 + Math.exp(-(t - s) / w));

  // 找沙堆表面位置 s，讓總量剛好等於 COUNT
  let a = -1.5, b = 2.5, s = 0.5;
  if (hi - lo > 1e-4) {
    for (let it = 0; it < 26; it++) {
      s = (a + b) / 2;
      let mass = 0;
      for (let j = 0; j < BINS; j++) if (hist[j]) mass += hist[j] * rho((j + 0.5) / BINS, s);
      if (mass > COUNT) a = s; else b = s;
    }
  }
  cum[0] = 0;
  for (let j = 0; j < BINS; j++) cum[j + 1] = cum[j] + hist[j] * rho((j + 0.5) / BINS, s);
  return ext;
}

// 沙粒之間的碰撞：用格子索引找鄰居，靠太近就各退一半
let hashW = 0, hashH = 0, head = new Int32Array(0);
const nextP = new Int32Array(COUNT);
function separate(hx, hy) {
  const w = Math.ceil(W / GRAIN) + 2, h = Math.ceil(H / GRAIN) + 2;
  if (w !== hashW || h !== hashH) { hashW = w; hashH = h; head = new Int32Array(w * h); }
  head.fill(-1);
  for (let i = 0; i < COUNT; i++) {
    const c = (((PY[i] + H / 2) / GRAIN + 1) | 0) * w + (((PX[i] + W / 2) / GRAIN + 1) | 0);
    nextP[i] = head[c]; head[c] = i;
  }
  const d2min = GRAIN * GRAIN;
  for (let i = 0; i < COUNT; i++) {
    const gxi = ((PX[i] + W / 2) / GRAIN + 1) | 0, gyi = ((PY[i] + H / 2) / GRAIN + 1) | 0;
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
      const cx = gxi + ox, cy = gyi + oy;
      if (cx < 0 || cy < 0 || cx >= w || cy >= h) continue;
      for (let j = head[cy * w + cx]; j !== -1; j = nextP[j]) {
        if (j <= i) continue;
        let dx = PX[j] - PX[i], dy = PY[j] - PY[i];
        const d2 = dx * dx + dy * dy;
        if (d2 >= d2min) continue;
        let d = Math.sqrt(d2);
        if (d < 1e-4) { const a = Math.random() * 6.2832; dx = Math.cos(a); dy = Math.sin(a); d = 1; }
        else { dx /= d; dy /= d; }
        const s = (GRAIN - d) * 0.5;
        PX[i] -= dx * s; PY[i] -= dy * s; PX[j] += dx * s; PY[j] += dy * s;
      }
    }
  }
  for (let i = 0; i < COUNT; i++) {
    if (PX[i] < -hx) PX[i] = -hx; else if (PX[i] > hx) PX[i] = hx;
    if (PY[i] < -hy) PY[i] = -hy; else if (PY[i] > hy) PY[i] = hy;
  }
}

// 插入排序：上一幀的順序幾乎已經排好，所以很快
function sortBy(order, key, from, to) {
  for (let i = from + 1; i < to; i++) {
    const o = order[i], k = key[o];
    let j = i - 1;
    while (j >= from && key[order[j]] > k) { order[j + 1] = order[j]; j--; }
    order[j + 1] = o;
  }
}

// 順位 u（0~1）→ 該粒子要落在哪個 t
function levelOf(u) {
  const target = u * cum[BINS];
  let lo = 0, hi = BINS;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (cum[mid + 1] < target) lo = mid + 1; else hi = mid; }
  const j = Math.min(lo, BINS - 1), span = cum[j + 1] - cum[j];
  return (j + (span > 0 ? (target - cum[j]) / span : 0.5)) / BINS;
}

// ───────── 主迴圈 ─────────
let last = performance.now(), tickAcc = TICK;
function frame(now) {
  requestAnimationFrame(frame);
  const ms = Math.min(50, now - last); last = now;
  const dt = ms / 1000, f = ms / 16.667;

  // 沒有陀螺儀也沒動滑鼠時：重力緩慢繞圈，讓畫面保持活著
  if (!sensor && now - lastMouse > 3000) {
    const t = now * 0.00022;
    tx = 0.7 * Math.cos(t + 1.0); ty = 0.7 * Math.sin(t + 1.0);
  }

  const e = 1 - Math.pow(1 - EASE, f);
  gx += (tx - gx) * e; gy += (ty - gy) * e;
  let m = Math.hypot(gx, gy);
  if (m > 1e-4) { dirx = gx / m; diry = gy / m; }
  if (m > 1) m = 1;

  const ext = solveLevels(m);
  const G = GRAV * (0.2 + 0.8 * Math.min(1, m / FULL));
  const ex = -diry, ey = dirx;                      // 等高線方向
  const hx = W / 2 - CELL / 2, hy = H / 2 - CELL / 2;
  const drag = Math.exp(-DRAG * dt);

  // 依目前位置排順位：越低的沙子落在越低的層；同一層裡越左的落在越左邊。
  // 沙子之間不會互相穿越，傾斜時整堆一起流過去。
  for (let i = 0; i < COUNT; i++) {
    KA[i] = PX[i] * dirx + PY[i] * diry;
    KL[i] = PX[i] * ex + PY[i] * ey;
  }
  sortBy(OA, KA, 0, COUNT);
  for (let r = 0; r < COUNT; r++) { QU[OA[r]] = (r + 0.5) / COUNT; OL[r] = OA[r]; }
  for (let b0 = 0; b0 < COUNT; b0 += BAND) {      // 每一層（BAND 顆）各自依左右排
    const b1 = Math.min(COUNT, b0 + BAND), n = b1 - b0;
    sortBy(OL, KL, b0, b1);
    for (let r = b0; r < b1; r++) QV[OL[r]] = (r - b0 + 0.5) / n;
  }

  for (let i = 0; i < COUNT; i++) {
    // 這顆沙子的落點：在它那一層等高線上，依左右順位取一點
    const t = levelOf(QU[i]);
    const cx = dirx * (t - 0.5) * 2 * ext, cy = diry * (t - 0.5) * 2 * ext;
    let l0 = -1e9, l1 = 1e9;
    if (Math.abs(ex) > 1e-6) { let p = (-hx - cx) / ex, q = (hx - cx) / ex; if (p > q) { const z = p; p = q; q = z; } if (p > l0) l0 = p; if (q < l1) l1 = q; }
    if (Math.abs(ey) > 1e-6) { let p = (-hy - cy) / ey, q = (hy - cy) / ey; if (p > q) { const z = p; p = q; q = z; } if (p > l0) l0 = p; if (q < l1) l1 = q; }
    const l = l0 <= l1 ? l0 + (l1 - l0) * QV[i] : (l0 + l1) / 2;
    const dx = cx + l * ex - PX[i], dy = cy + l * ey - PY[i];

    // 沿重力方向：還沒到就往下掉（像沙子），到了就停；橫向慢慢滑
    const da = dx * dirx + dy * diry, dl = dx * ex + dy * ey;
    const fa = G * Math.max(-1, Math.min(1, da / SOFT));
    const fl = G * LATERAL * Math.max(-1, Math.min(1, dl / SOFT));
    VX[i] += (fa * dirx + fl * ex) * dt;
    VY[i] += (fa * diry + fl * ey) * dt;
    const near = Math.exp(-(Math.abs(da) + Math.abs(dl)) / SOFT);
    const k = drag * Math.exp(-SETTLE * near * dt);
    VX[i] *= k; VY[i] *= k;
    PX[i] += VX[i] * dt; PY[i] += VY[i] * dt;

    // 牆壁
    if (PX[i] < -hx) { PX[i] = -hx; if (VX[i] < 0) VX[i] = 0; } else if (PX[i] > hx) { PX[i] = hx; if (VX[i] > 0) VX[i] = 0; }
    if (PY[i] < -hy) { PY[i] = -hy; if (VY[i] < 0) VY[i] = 0; } else if (PY[i] > hy) { PY[i] = hy; if (VY[i] > 0) VY[i] = 0; }
  }

  // 沙粒互相頂住，不重疊
  for (let it = 0; it < 2; it++) separate(hx, hy);

  // 手指把沙子推開（移動太快時分段推，避免穿過）
  const g = 1 - Math.pow(1 - GROW, f);
  for (const t of touches.values()) {
    t.r += (pushR - t.r) * g;
    const steps = Math.max(1, Math.min(10, Math.ceil(Math.hypot(t.x - t.lx, t.y - t.ly) / (t.r * 0.4 + 1))));
    for (let s = 1; s <= steps; s++) {
      const q = s / steps;
      push(t.lx + (t.x - t.lx) * q, t.ly + (t.y - t.ly) * q, t.r);
    }
    t.lx = t.x; t.ly = t.y;
  }

  // 每 TICK 毫秒換一張畫面
  tickAcc += ms;
  if (tickAcc >= TICK) { tickAcc %= TICK; draw(); }
}

// 畫一張：每顆沙子在原位附近跳一下，亮起時取樣一次相機
function draw() {
  let src = null;
  if (camReady && video.readyState >= 2) {
    sctx.drawImage(video, 0, 0, SW, SH);
    src = new Uint32Array(sctx.getImageData(0, 0, SW, SH).data.buffer);
  }
  const s = Math.max(W / SW, H / SH), spread = SCATTER * Math.max(SW, SH);
  const hw = W / 2, hh = H / 2;

  buf.fill(BLACK);
  for (let i = 0; i < COUNT; i++) {
    const cx = Math.floor((PX[i] + hw) / CELL + (Math.random() + Math.random() - 1) * JITTER);
    const cy = Math.floor((PY[i] + hh) / CELL + (Math.random() + Math.random() - 1) * JITTER);
    if (cx < 0 || cx >= cols || cy < 0 || cy >= rows) continue;

    let c = WHITE;
    if (src) {
      // 在這一格對應的相機位置附近亂數取樣（三角分布：越靠近中心機率越高）
      const px = (cx + 0.5) * CELL - hw, py = (cy + 0.5) * CELL - hh;
      let sx = px / s + SW / 2, sy = py / s + SH / 2;
      if (mirror) sx = SW - sx;
      sx += (Math.random() + Math.random() - 1) * spread;
      sy += (Math.random() + Math.random() - 1) * spread;
      sx = sx < 0 ? 0 : sx >= SW ? SW - 1 : sx;
      sy = sy < 0 ? 0 : sy >= SH ? SH - 1 : sy;
      c = src[(sy | 0) * SW + (sx | 0)] | BLACK;
    }
    buf[cy * cols + cx] = c;
  }

  gctx.putImageData(img, 0, 0);
  vctx.drawImage(grid, 0, 0, view.width, view.height);
}

// ───────── 相機 ─────────
function setupSample() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return;
  const s = SAMPLE / Math.max(vw, vh);
  SW = Math.max(1, Math.round(vw * s)); SH = Math.max(1, Math.round(vh * s));
  samp.width = SW; samp.height = SH;
  camReady = true;
}
video.addEventListener('loadedmetadata', setupSample);
video.addEventListener('resize', setupSample);

// ───────── 開始（權限必須在點擊當下請求） ─────────
let starting = false;
splash.addEventListener('click', async e => {
  e.stopPropagation();
  if (starting || started) return;
  starting = true;
  splash.classList.add('wait');
  const DOE = window.DeviceOrientationEvent;
  const motionP = (DOE && typeof DOE.requestPermission === 'function')
    ? DOE.requestPermission().catch(() => 'denied') : Promise.resolve('granted');
  const camP = (navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
    ? navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false
      }).catch(() => null)
    : Promise.resolve(null);

  // 等權限都回覆了，才關掉 splash、開始粒子
  const [, stream] = await Promise.all([motionP, camP]);
  if (stream) {
    const st = stream.getVideoTracks()[0]?.getSettings?.() || {};
    mirror = st.facingMode ? st.facingMode === 'user' : true;   // 自拍鏡頭像鏡子一樣左右相反
    video.srcObject = stream;
    video.play().catch(() => {});
  }

  started = true;
  last = performance.now();
  requestAnimationFrame(frame);
  splash.classList.add('out');
  setTimeout(() => splash.remove(), 600);
  keepAwake();
});

// 螢幕常亮
let lock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator) lock = await navigator.wakeLock.request('screen'); } catch (_) {}
}
document.addEventListener('visibilitychange', () => { if (started && document.visibilityState === 'visible') keepAwake(); });

let rt;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { touches.clear(); layout(); }, 120); });

// splash 標題的點點底線：「kshanaCam」字寬 5309 單位，排 143 個點、置中
(() => {
  const svg = go.querySelector('.ul'), NS = 'http://www.w3.org/2000/svg';
  const WIDTH = 5309, D = 20, GAP = 37;
  const n = Math.floor((WIDTH - D) / GAP) + 1;
  const x0 = (WIDTH - ((n - 1) * GAP + D)) / 2 + D / 2;
  for (let i = 0; i < n; i++) {
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', x0 + i * GAP); c.setAttribute('cy', D / 2); c.setAttribute('r', D / 2); c.setAttribute('fill', '#fff');
    svg.appendChild(c);
  }
})();

layout();   // 先切好格子；粒子要等按下 splash、取得權限後才開始
</script>
</body>
</html>
